<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe - you vs the machine</title>
<style>
  :root { --bg:#101418; --panel:#1a2129; --line:#2b3540; --text:#e9eef4; --dim:#8b98a5; --x:#5ec4e8; --o:#e8a55e; --accent:#7ee0a3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:28px 14px 40px; }
  h1 { font-size:30px; }
  .sub { color:var(--dim); margin:6px 0 16px; font-size:14px; }
  .opts { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; justify-content:center; }
  .opts button { background:transparent; color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  .opts button.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  #board { display:grid; grid-template-columns:repeat(3,96px); grid-template-rows:repeat(3,96px); gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .cell { background:#12181e; border-radius:10px; font-size:52px; font-weight:800; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .1s; }
  .cell:hover:not(.taken) { background:#18222b; }
  .cell.x { color:var(--x); } .cell.o { color:var(--o); }
  .cell.win { background:rgba(126,224,163,.18); outline:2px solid var(--accent); }
  #status { margin-top:16px; min-height:24px; font-size:16px; }
  #score { margin-top:6px; color:var(--dim); font-size:14px; }
  #again { margin-top:14px; background:var(--accent); color:#101418; border:none; border-radius:9px; padding:10px 26px; font-size:15px; font-weight:700; cursor:pointer; }
  .foot { margin-top:18px; color:var(--dim); font-size:13px; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<h1>Tic Tac Toe</h1>
<div class="sub">you vs the machine - unbeatable mode never loses</div>

<div class="opts">
  <button id="side-x" class="on">Play X (first)</button>
  <button id="side-o">Play O</button>
  <button id="mode-hard" class="on">Unbeatable</button>
  <button id="mode-easy">Casual</button>
</div>

<div id="board"></div>
<div id="status"></div>
<div id="score"></div>
<button id="again">New round</button>
<div class="foot"><a href="index.html">&larr; about</a></div>

<script src="engine.js?v=1"></script>
<script>
(function () {
  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var scoreEl = document.getElementById('score');

  var board, human, ai, over, mode = 'hard';

  function loadScore() {
    try { return JSON.parse(localStorage.getItem('ttt-score')) || { you: 0, draws: 0, ai: 0 }; }
    catch (e) { return { you: 0, draws: 0, ai: 0 }; }
  }
  function saveScore(s) { try { localStorage.setItem('ttt-score', JSON.stringify(s)); } catch (e) {} }

  function newRound() {
    board = [null,null,null,null,null,null,null,null,null];
    over = null;
    statusEl.textContent = human === 'X' ? 'Your move' : 'Machine is thinking...';
    render();
    if (ai === 'X') setTimeout(aiMove, 350);
  }

  function render() {
    boardEl.innerHTML = '';
    for (var i = 0; i < 9; i++) {
      (function (idx) {
        var c = document.createElement('div');
        c.className = 'cell';
        var v = board[idx];
        if (v) { c.classList.add('taken', v.toLowerCase()); c.textContent = v; }
        if (over && over.line && over.line.indexOf(idx) !== -1) c.classList.add('win');
        c.addEventListener('click', function () { play(idx); });
        boardEl.appendChild(c);
      })(i);
    }
    var s = loadScore();
    scoreEl.textContent = 'you ' + s.you + ' - draws ' + s.draws + ' - machine ' + s.ai;
  }

  function finish(res) {
    over = res;
    var s = loadScore();
    if (res.player === 'draw') { s.draws++; statusEl.textContent = 'Draw.'; }
    else if (res.player === human) { s.you++; statusEl.textContent = 'You win!'; }
    else { s.ai++; statusEl.textContent = 'Machine wins.'; }
    saveScore(s);
    render();
  }

  function play(idx) {
    if (over || board[idx]) return;
    board[idx] = human;
    var res = TicTacToe.result(board);
    if (res) { finish(res); return; }
    render();
    statusEl.textContent = 'Machine is thinking...';
    setTimeout(aiMove, 350);
  }

  function aiMove() {
    if (over) return;
    var idx = mode === 'hard' ? TicTacToe.bestMove(board, ai) : TicTacToe.randomMove(board, Math.random);
    board[idx] = ai;
    var res = TicTacToe.result(board);
    if (res) { finish(res); return; }
    statusEl.textContent = 'Your move';
    render();
  }

  function setSide(x) {
    human = x; ai = x === 'X' ? 'O' : 'X';
    document.getElementById('side-x').classList.toggle('on', x === 'X');
    document.getElementById('side-o').classList.toggle('on', x !== 'X');
    newRound();
  }
  function setMode(m) {
    mode = m;
    document.getElementById('mode-hard').classList.toggle('on', m === 'hard');
    document.getElementById('mode-easy').classList.toggle('on', m !== 'hard');
  }

  document.getElementById('side-x').addEventListener('click', function () { setSide('X'); });
  document.getElementById('side-o').addEventListener('click', function () { setSide('O'); });
  document.getElementById('mode-hard').addEventListener('click', function () { setMode('hard'); });
  document.getElementById('mode-easy').addEventListener('click', function () { setMode('easy'); });
  document.getElementById('again').addEventListener('click', newRound);

  // test hook
  window.__ttt = {
    state: function () { return { board: board.slice(), human: human, ai: ai, mode: mode, over: over }; },
    setBoard: function (b) { board = b.slice(); render(); },
    setMode: setMode
  };

  human = 'X'; ai = 'O';
  newRound();
})();
</script>
</body>
</html>
